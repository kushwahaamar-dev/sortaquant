[project]
name = "sortaquant"
version = "0.1.0"
description = "RAIM: Regime-Adaptive, Inventory-Aware Market Making Engine"
readme = "README.md"
authors = [
    { name = "Amar Kushwaha", email = "247959358+kushwahaamar-dev@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "pydantic>=2.6.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
sortaquant = "sortaquant.cli:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

